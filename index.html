<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>EigoNote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a22;
      --surface2: #22222e;
      --border: #2e2e3e;
      --accent: #7c6dfa;
      --accent2: #e8857a;
      --gold: #f0c060;
      --text: #e8e8f0;
      --text2: #9090aa;
      --success: #5dce8e;
      --danger: #e8556a;
      --radius: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body { height: 100%; overscroll-behavior: none; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    #app {
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      margin: 0 auto;
    }

    /* ── Header ── */
    .app-header {
      padding: calc(12px + var(--safe-top)) 24px 12px;
      background: linear-gradient(135deg, var(--surface), var(--surface2));
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .app-logo { font-size: 28px; }
    .app-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .app-subtitle { font-size: 11px; color: var(--text2); margin-top: 2px; }

    /* ── Tab Bar ── */
    .tab-bar {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 10px 4px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 10px;
      position: relative;
      transition: color .2s;
    }
    .tab-btn.active { color: var(--accent); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 20%; right: 20%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }
    .tab-icon { font-size: 18px; }

    /* ── Content ── */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 20px calc(20px + var(--safe-bottom));
    }

    /* ── Review ── */
    .review-tab { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .deck-info { font-size: 13px; color: var(--text2); font-family: 'DM Mono', monospace; }

    .card-stage {
      width: 100%;
      perspective: 1000px;
      position: relative;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .flip-card {
      width: 100%; max-width: 380px; height: 260px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform .5s cubic-bezier(.4,0,.2,1);
      cursor: pointer;
      border-radius: var(--radius);
      user-select: none; -webkit-user-select: none;
    }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-card.leave-left  { animation: leaveLeft  .35s forwards; }
    .flip-card.leave-right { animation: leaveRight .35s forwards; }
    @keyframes leaveLeft  { to { transform: translateX(-120%) rotate(-15deg); opacity: 0; } }
    @keyframes leaveRight { to { transform: translateX( 120%) rotate( 15deg); opacity: 0; } }

    .card-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border-radius: var(--radius);
      padding: 28px 24px;
      display: flex; flex-direction: column; justify-content: center; gap: 12px;
      box-shadow: 0 8px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .card-front { background: linear-gradient(135deg,#1e1e2e,#252535); border: 1px solid var(--border); }
    .card-back  { background: linear-gradient(135deg,#1a1e2e,#1e2535); border: 1px solid #2a3060; transform: rotateY(180deg); overflow-y: auto; }

    .card-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--text2); text-transform: uppercase; letter-spacing: .1em; }
    .card-text  { font-size: 20px; line-height: 1.6; font-weight: 500; }
    .card-text.en { font-size: 18px; color: #a8c4ff; letter-spacing: .02em; }
    .card-hint  { font-size: 11px; color: var(--text2); text-align: center; margin-top: auto; }

    .advice-toggle {
      background: rgba(124,109,250,.15); border: 1px solid rgba(124,109,250,.3);
      border-radius: 8px; color: var(--accent); padding: 6px 12px; font-size: 12px;
      cursor: pointer; font-family: 'Noto Sans JP', sans-serif; text-align: left;
    }
    .advice-box {
      background: rgba(248,196,80,.06); border: 1px solid rgba(248,196,80,.2);
      border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #f0c060; line-height: 1.7;
    }

    .swipe-indicator {
      position: absolute; top: 50%; transform: translateY(-50%);
      font-size: 14px; font-weight: 700; padding: 8px 16px; border-radius: 20px; pointer-events: none; z-index: 10;
    }
    .swipe-indicator.right { right: -10px; background: rgba(93,206,142,.2); color: var(--success); border: 1px solid var(--success); }
    .swipe-indicator.left  { left:  -10px; background: rgba(232,85,106,.2);  color: var(--danger);  border: 1px solid var(--danger);  }

    .review-actions { display: flex; gap: 12px; width: 100%; max-width: 380px; }
    .btn-action {
      flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 14px; cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif; transition: background .2s;
    }
    .btn-action.next { background: var(--accent); border-color: var(--accent); color: #fff; }
    .swipe-hint { font-size: 11px; color: var(--text2); text-align: center; }

    /* ── Add Tab ── */
    .add-tab { display: flex; flex-direction: column; gap: 20px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; color: var(--text2); font-weight: 500; }

    textarea, input[type="text"], input[type="password"], input:not([type]) {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 15px;
      padding: 14px 16px; resize: none; width: 100%; -webkit-appearance: none; transition: border .2s;
    }
    textarea:focus, input:focus { outline: none; border-color: var(--accent); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9c8dfa);
      border: none; border-radius: 14px; color: #fff;
      font-family: 'Noto Sans JP', sans-serif; font-size: 15px; font-weight: 700;
      padding: 16px; cursor: pointer; width: 100%; -webkit-appearance: none;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .2s;
    }
    .btn-primary:disabled { opacity: .5; cursor: default; }
    .btn-primary.loading  { background: var(--surface2); color: var(--text2); }
    .btn-primary.success  { background: linear-gradient(135deg, var(--success), #4dbe7e); }

    .btn-secondary {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px;
      padding: 12px; cursor: pointer; width: 100%;
    }
    .btn-danger {
      background: rgba(232,85,106,.12); border: 1px solid rgba(232,85,106,.3);
      border-radius: 12px; color: var(--danger);
      font-family: 'Noto Sans JP', sans-serif; font-size: 14px; padding: 12px; cursor: pointer; width: 100%;
    }

    .ai-note { font-size: 12px; color: var(--text2); text-align: center; }
    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── List Tab ── */
    .list-tab { display: flex; flex-direction: column; gap: 16px; }
    .count-badge { background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 13px; font-family: 'DM Mono', monospace; }
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .list-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
    .list-card-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .list-jp   { font-size: 15px; font-weight: 500; line-height: 1.5; }
    .list-en   { font-size: 12px; color: #a8c4ff; line-height: 1.5; font-family: 'DM Mono', monospace; }
    .list-advice { font-size: 12px; color: var(--gold); background: rgba(240,192,96,.07); border-radius: 8px; padding: 6px 10px; line-height: 1.6; }
    .list-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; }
    .btn-delete { background: none; border: none; cursor: pointer; font-size: 18px; opacity: .4; transition: opacity .2s; padding: 4px; }
    .btn-delete:hover { opacity: 1; }

    /* ── Settings Tab ── */
    .settings-tab { display: flex; flex-direction: column; gap: 20px; }
    .settings-section { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .settings-section h3 { font-size: 14px; color: var(--text2); font-weight: 500; }
    .key-status { font-size: 12px; padding: 6px 12px; border-radius: 8px; font-family: 'DM Mono', monospace; display: inline-block; }
    .key-status.set   { background: rgba(93,206,142,.1);  color: var(--success); border: 1px solid rgba(93,206,142,.3); }
    .key-status.unset { background: rgba(232,85,106,.1); color: var(--danger);  border: 1px solid rgba(232,85,106,.3); }

    /* ── Utils ── */
    .empty-state { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 80px 20px; text-align: center; }
    .empty-icon  { font-size: 56px; }
    .empty-state p { font-size: 16px; }
    .empty-state .sub { font-size: 13px; color: var(--text2); }
    .empty-msg { font-size: 14px; color: var(--text2); text-align: center; padding: 20px; }
    .error-msg { color: var(--danger); font-size: 13px; }
  </style>
</head>
<body>
<div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── 定数 ──────────────────────────────────────────────────────────────────
const STORAGE_KEY  = 'eigonote_cards_v1';
const APIKEY_KEY   = 'eigonote_apikey';
const REVIEW_COUNT = 10;

const defaultCards = [
  {
    id: 1,
    japanese: "彼女は毎朝コーヒーを飲む。",
    english: "She drinks coffee every morning.",
    advice: "「every morning」は習慣を表す現在形と相性抜群。副詞句は文末に置くのが自然です。",
    createdAt: Date.now() - 86400000, reviewCount: 3, lastReviewed: Date.now() - 3600000,
  },
  {
    id: 2,
    japanese: "昨日、図書館で友達に会った。",
    english: "I ran into my friend at the library yesterday.",
    advice: "「ran into」は偶然会う意味のイディオム。「met」より自然な口語表現です。",
    createdAt: Date.now() - 172800000, reviewCount: 1, lastReviewed: Date.now() - 7200000,
  },
];

// ── ストレージ ─────────────────────────────────────────────────────────────
function loadCards()  { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : defaultCards; } catch { return defaultCards; } }
function saveCards(c) { localStorage.setItem(STORAGE_KEY, JSON.stringify(c)); }
function loadApiKey() { return localStorage.getItem(APIKEY_KEY) || ''; }
function saveApiKey(k){ localStorage.setItem(APIKEY_KEY, k); }

// ── ユーティリティ ────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pickDeck(cards) { return shuffle(cards).slice(0, Math.min(REVIEW_COUNT, cards.length)); }

// ── AI アドバイス取得 ─────────────────────────────────────────────────────
async function fetchAIAdvice(japanese, english, apiKey) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-haiku-4-5-20251001",
      max_tokens: 300,
      messages: [{ role: "user", content:
        `以下の英文と日本語訳について、英語学習者向けに簡潔なアドバイスを1〜2文で日本語で提供してください。\n文法上の注意点、語法、より自然な表現、ニュアンスの違いなど、学習に役立つ点を指摘してください。\n\n日本語: ${japanese}\n英語: ${english}\n\nアドバイスのみを返してください（前置きや説明は不要）。`
      }],
    }),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content?.map(b => b.text || "").join("") || "";
}

// ── TabBar ────────────────────────────────────────────────────────────────
function TabBar({ tab, setTab }) {
  const tabs = [
    { id:"review",   label:"復習", icon:"🔄" },
    { id:"add",      label:"追加", icon:"✏️" },
    { id:"list",     label:"一覧", icon:"📚" },
    { id:"settings", label:"設定", icon:"⚙️" },
  ];
  return (
    <nav className="tab-bar">
      {tabs.map(t => (
        <button key={t.id} className={`tab-btn ${tab===t.id?"active":""}`} onClick={() => setTab(t.id)}>
          <span className="tab-icon">{t.icon}</span>
          <span>{t.label}</span>
        </button>
      ))}
    </nav>
  );
}

// ── ReviewTab ─────────────────────────────────────────────────────────────
function ReviewTab({ cards, onUpdate }) {
  const [deck, setDeck]             = useState(() => pickDeck(cards));
  const [idx, setIdx]               = useState(0);
  const [flipped, setFlipped]       = useState(false);
  const [showAdvice, setShowAdvice] = useState(false);
  const [dragStart, setDragStart]   = useState(null);
  const [dragDelta, setDragDelta]   = useState(0);
  const [leaving, setLeaving]       = useState(null);
  const [done, setDone]             = useState(false);

  const restart = () => { setDeck(pickDeck(cards)); setIdx(0); setFlipped(false); setShowAdvice(false); setDone(false); };
  const current = deck[idx];

  const next = useCallback((dir) => {
    if (!current) return;
    onUpdate(current.id, { reviewCount: (current.reviewCount||0)+1, lastReviewed: Date.now() });
    setLeaving(dir);
    setTimeout(() => {
      setFlipped(false); setShowAdvice(false); setLeaving(null);
      if (idx + 1 >= deck.length) setDone(true);
      else setIdx(i => i + 1);
    }, 350);
  }, [current, idx, deck.length, onUpdate]);

  const onTS = e => setDragStart(e.touches[0].clientX);
  const onTM = e => { if (dragStart !== null) setDragDelta(e.touches[0].clientX - dragStart); };
  const onTE = () => { if (Math.abs(dragDelta) > 80) next(dragDelta > 0 ? "right" : "left"); setDragStart(null); setDragDelta(0); };
  const onMD = e => setDragStart(e.clientX);
  const onMM = e => { if (dragStart !== null) setDragDelta(e.clientX - dragStart); };
  const onMU = () => { if (Math.abs(dragDelta) > 80) next(dragDelta > 0 ? "right" : "left"); setDragStart(null); setDragDelta(0); };

  if (!cards.length)
    return <div className="empty-state"><div className="empty-icon">📖</div><p>まだカードがありません。</p><p className="sub">「追加」タブから英文を登録しましょう！</p></div>;

  if (done)
    return (
      <div className="empty-state">
        <div className="empty-icon">🎉</div>
        <p style={{fontSize:"20px",fontWeight:"700"}}>お疲れさまでした！</p>
        <p className="sub">{deck.length}問すべて完了しました</p>
        <button className="btn-primary" style={{marginTop:"16px",maxWidth:"240px"}} onClick={restart}>もう一度（新しい10問）</button>
      </div>
    );

  if (!current) return null;
  const tx = dragStart !== null ? dragDelta : 0;
  const rot = dragStart !== null ? dragDelta * 0.08 : 0;

  return (
    <div className="review-tab">
      <div className="deck-info">{idx+1} / {deck.length}問</div>
      <div className="card-stage">
        <div
          className={`flip-card ${flipped?"flipped":""} ${leaving?`leave-${leaving}`:""}`}
          style={{ transform: dragStart!==null ? `translateX(${tx}px) rotate(${rot}deg)` : undefined, transition: dragStart!==null ? "none" : undefined }}
          onClick={() => dragStart===null && Math.abs(dragDelta)<5 && setFlipped(f=>!f)}
          onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}
          onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}
        >
          <div className="card-face card-front">
            <div className="card-label">🇯🇵 日本語</div>
            <div className="card-text jp">{current.japanese}</div>
            <div className="card-hint">タップで英文を表示</div>
          </div>
          <div className="card-face card-back">
            <div className="card-label">🇺🇸 英語</div>
            <div className="card-text en">{current.english}</div>
            {current.advice && (
              <button className="advice-toggle" onClick={e => { e.stopPropagation(); setShowAdvice(v=>!v); }}>
                💡 {showAdvice ? "アドバイスを隠す" : "アドバイスを見る"}
              </button>
            )}
            {showAdvice && current.advice && <div className="advice-box">{current.advice}</div>}
          </div>
        </div>
        {dragStart!==null && dragDelta >  40 && <div className="swipe-indicator right">✓ 次へ</div>}
        {dragStart!==null && dragDelta < -40 && <div className="swipe-indicator left">✓ 次へ</div>}
      </div>
      <div className="review-actions">
        <button className="btn-action skip" onClick={() => next("left")}>⟵ スキップ</button>
        <button className="btn-action next"  onClick={() => next("right")}>次へ ⟶</button>
      </div>
      <p className="swipe-hint">← カードをスワイプしても次へ進みます →</p>
    </div>
  );
}

// ── AddTab ────────────────────────────────────────────────────────────────
function AddTab({ onAdd, apiKey }) {
  const [japanese, setJapanese] = useState("");
  const [english, setEnglish]   = useState("");
  const [loading, setLoading]   = useState(false);
  const [success, setSuccess]   = useState(false);
  const [error, setError]       = useState("");

  const handleSubmit = async () => {
    if (!japanese.trim() || !english.trim()) return;
    setLoading(true); setError("");
    let advice = "";
    if (apiKey) {
      try { advice = await fetchAIAdvice(japanese.trim(), english.trim(), apiKey); }
      catch(e) { setError("AIアドバイスの取得に失敗しました。設定タブでAPIキーを確認してください。"); }
    }
    onAdd({ japanese: japanese.trim(), english: english.trim(), advice });
    setJapanese(""); setEnglish("");
    setLoading(false); setSuccess(true);
    setTimeout(() => setSuccess(false), 2000);
  };

  return (
    <div className="add-tab">
      <h2 className="section-title">新しいカードを追加</h2>
      <div className="input-group">
        <label>🇯🇵 日本語</label>
        <textarea value={japanese} onChange={e => setJapanese(e.target.value)} placeholder="日本語の文章を入力..." rows={3} />
      </div>
      <div className="input-group">
        <label>🇺🇸 英語</label>
        <textarea value={english} onChange={e => setEnglish(e.target.value)} placeholder="英語の文章を入力..." rows={3} />
      </div>
      {error && <p className="error-msg">{error}</p>}
      <button
        className={`btn-primary ${loading?"loading":""} ${success?"success":""}`}
        onClick={handleSubmit}
        disabled={loading || !japanese.trim() || !english.trim()}
      >
        {loading ? <><span className="spinner" /> AIがアドバイスを生成中...</>
         : success ? "✓ 追加しました！"
         : apiKey  ? "＋ カードを追加（AIアドバイス付き）"
                   : "＋ カードを追加"}
      </button>
      {apiKey
        ? <p className="ai-note">💡 AIが文法・語法のアドバイスを自動生成します</p>
        : <p className="ai-note">⚙️ 設定タブでAPIキーを登録するとAIアドバイスが使えます</p>}
    </div>
  );
}

// ── ListTab ───────────────────────────────────────────────────────────────
function ListTab({ cards, onDelete }) {
  const [search, setSearch] = useState("");
  const filtered = cards.filter(c => c.japanese.includes(search) || c.english.toLowerCase().includes(search.toLowerCase()));
  return (
    <div className="list-tab">
      <h2 className="section-title">カード一覧 <span className="count-badge">{cards.length}</span></h2>
      <input placeholder="🔍 検索..." value={search} onChange={e => setSearch(e.target.value)} />
      <div className="card-list">
        {filtered.map(card => (
          <div key={card.id} className="list-card">
            <div className="list-card-content">
              <div className="list-jp">{card.japanese}</div>
              <div className="list-en">{card.english}</div>
              {card.advice && <div className="list-advice">💡 {card.advice}</div>}
              <div className="list-meta">復習回数: {card.reviewCount||0}回</div>
            </div>
            <button className="btn-delete" onClick={() => onDelete(card.id)}>🗑</button>
          </div>
        ))}
        {filtered.length === 0 && <p className="empty-msg">該当するカードがありません。</p>}
      </div>
    </div>
  );
}

// ── SettingsTab ───────────────────────────────────────────────────────────
function SettingsTab({ apiKey, setApiKey, cards, onImport, onClearAll }) {
  const [keyInput, setKeyInput] = useState("");
  const [saved, setSaved]       = useState(false);
  const fileRef = useRef(null);

  const saveKey = () => {
    saveApiKey(keyInput.trim()); setApiKey(keyInput.trim()); setKeyInput("");
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };
  const exportData = () => {
    const blob = new Blob([JSON.stringify(cards, null, 2)], { type:"application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "eigonote-backup.json"; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (Array.isArray(data)) { onImport(data); alert(`${data.length}件インポートしました`); }
        else alert("フォーマットが正しくありません");
      } catch { alert("ファイルの読み込みに失敗しました"); }
    };
    reader.readAsText(file);
  };

  return (
    <div className="settings-tab">
      <h2 className="section-title">⚙️ 設定</h2>

      <div className="settings-section">
        <h3>🔑 Anthropic APIキー</h3>
        <p style={{fontSize:"12px",color:"var(--text2)",lineHeight:"1.8"}}>
          カード追加時のAIアドバイス生成に必要です。<br/>
          キーはこのデバイスのブラウザ内にのみ保存されます。<br/>
          取得先: <strong style={{color:"var(--accent)"}}>console.anthropic.com</strong>
        </p>
        <div className={`key-status ${apiKey?"set":"unset"}`}>{apiKey ? "✓ APIキー設定済み" : "✗ 未設定"}</div>
        <input type="password" placeholder="sk-ant-..." value={keyInput} onChange={e => setKeyInput(e.target.value)} />
        <button className={`btn-primary ${saved?"success":""}`} onClick={saveKey} disabled={!keyInput.trim()}>
          {saved ? "✓ 保存しました" : "保存する"}
        </button>
        {apiKey && <button className="btn-danger" onClick={() => { saveApiKey(""); setApiKey(""); }}>APIキーを削除</button>}
      </div>

      <div className="settings-section">
        <h3>💾 データのバックアップ</h3>
        <p style={{fontSize:"12px",color:"var(--text2)"}}>カードデータをJSONファイルで書き出し・読み込みできます。機種変更時などにご利用ください。</p>
        <button className="btn-primary" onClick={exportData}>⬇️ エクスポート（{cards.length}件）</button>
        <button className="btn-secondary" onClick={() => fileRef.current.click()}>⬆️ インポート</button>
        <input ref={fileRef} type="file" accept=".json" style={{display:"none"}} onChange={importData} />
      </div>

      <div className="settings-section">
        <h3>⚠️ 危険な操作</h3>
        <button className="btn-danger" onClick={onClearAll}>すべてのカードを削除</button>
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App() {
  const [cards, setCards]   = useState(loadCards);
  const [tab, setTab]       = useState("review");
  const [apiKey, setApiKey] = useState(loadApiKey);

  useEffect(() => saveCards(cards), [cards]);

  const addCard    = data => setCards(prev => [{ id:Date.now(), ...data, createdAt:Date.now(), reviewCount:0, lastReviewed:null }, ...prev]);
  const updateCard = (id, u) => setCards(prev => prev.map(c => c.id===id ? {...c,...u} : c));
  const deleteCard = id => { if (confirm("このカードを削除しますか？")) setCards(prev => prev.filter(c => c.id!==id)); };
  const importCards = data => setCards(prev => { const ids = new Set(prev.map(c=>c.id)); return [...prev, ...data.filter(c=>!ids.has(c.id))]; });
  const clearAll   = () => { if (confirm("すべてのカードを削除します。この操作は取り消せません。")) setCards([]); };

  return (
    <div id="app">
      <header className="app-header">
        <div className="app-logo">📘</div>
        <div>
          <div className="app-title">EigoNote</div>
          <div className="app-subtitle">AI英語学習アプリ</div>
        </div>
      </header>
      <TabBar tab={tab} setTab={setTab} />
      <div className="tab-content">
        {tab==="review"   && <ReviewTab cards={cards} onUpdate={updateCard} />}
        {tab==="add"      && <AddTab onAdd={addCard} apiKey={apiKey} />}
        {tab==="list"     && <ListTab cards={cards} onDelete={deleteCard} />}
        {tab==="settings" && <SettingsTab apiKey={apiKey} setApiKey={setApiKey} cards={cards} onImport={importCards} onClearAll={clearAll} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
